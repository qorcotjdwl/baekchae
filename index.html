<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>백채 근무일지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f1b16;--sub:#7a7268;--line:#e7e1d8;--red:#c0392b;--red2:#fbeae7;--blue:#2c5d9e;--green:#2e7d4f;--green2:#e6f3ea;--amber:#b7791f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header .brand{font-weight:900;letter-spacing:-.3px}
header .brand small{font-weight:400;opacity:.6;margin-left:6px;font-size:12px}
header .me{font-size:13px;opacity:.85;background:none;border:1px solid #fff4;color:#fff;border-radius:20px;padding:4px 10px}
.wrap{padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h3 .cnt{font-size:12px;color:var(--sub);font-weight:500}
.hero{text-align:center;padding:22px 16px 18px}
.hero .ym{color:var(--sub);font-size:13px}
.hero .day{font-size:84px;font-weight:900;line-height:1;margin:4px 0}
.hero .dow{font-size:22px;font-weight:700}
.hero .dow.sun{color:var(--red)}.hero .dow.sat{color:var(--blue)}
.hero .nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.hero .nav button{border:none;background:var(--bg);border-radius:10px;padding:8px 14px;color:var(--sub)}
.cover{border:none;width:100%;min-height:calc(100vh - 170px);background:var(--card);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.cover .ym{color:var(--sub);font-size:16px}
.cover .day{font-size:150px;font-weight:900;line-height:1;margin:8px 0}
.cover .dow{font-size:30px;font-weight:700}
.cover .dow.sun{color:var(--red)}.cover .dow.sat{color:var(--blue)}
.cover .hint{margin-top:34px;font-size:13px;color:var(--sub)}
.tile{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:none;border-radius:16px;padding:18px 16px;margin-bottom:10px;text-align:left;color:var(--ink)}
.tile .ic{font-size:30px}.tile .tx{flex:1}.tile b{display:block;font-size:18px}.tile small{color:var(--sub);font-size:13px}.tile em{color:var(--red);font-style:normal;font-weight:700}.tile .ar{font-size:24px;color:var(--sub)}
.sech{margin:0;font-size:24px}
.back{border:none;background:none;color:var(--sub);padding:4px 0 10px;font-size:14px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--sub)}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch button{border:none;border-radius:14px;padding:18px 0;font-size:18px;font-weight:700;color:#fff}
.punch .in{background:var(--green)}.punch .out{background:var(--ink)}
.punch button:disabled{opacity:.35}
.msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:10px;display:none}
.msg.show{display:block}.msg.ok{background:var(--green2);color:var(--green)}.msg.err{background:var(--red2);color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row .n{font-weight:700}.row .t{color:var(--sub);font-size:13px}
.shift{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--green)}.dot.done{background:var(--ink)}
.task{border-top:1px solid var(--line);padding:11px 0}
.task:first-of-type{border-top:none}
.task .top{display:flex;align-items:center;gap:10px}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-weight:900;font-size:14px}
.task.done .box{background:var(--green);border-color:var(--green)}
.task .name{flex:1;font-weight:500}
.task.done .name{color:var(--sub)}
.task .who{font-size:12px;color:var(--green);font-weight:700;text-align:right}
.task .must{font-size:10px;background:var(--red2);color:var(--red);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700}
.task .tip{font-size:12.5px;color:var(--sub);margin:8px 0 0 36px;line-height:1.55;display:none;white-space:pre-line}
.task.open .tip{display:block}
.task .cam{position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 7px;font-size:14px;cursor:pointer}
.task .cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.task .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none}
.big{width:100%;border-radius:12px;display:block}
.task .more{border:none;background:none;color:var(--sub);font-size:12px;padding:4px}
.ho{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ho .meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:6px}
.ho .txt{white-space:pre-wrap;line-height:1.55}
.ho .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.re{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:13px}
.re.mine{background:var(--green2);border-color:var(--green);color:var(--green)}
.ho .seen{font-size:12px;color:var(--sub);margin-top:8px}
.ho .edit{margin-left:auto;border:none;background:none;color:var(--sub);font-size:12px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:70px;resize:vertical}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:#fff}
.btn.full{width:100%}.btn.ghost{background:var(--bg);color:var(--ink)}.btn.red{background:var(--red)}.btn.green{background:var(--green)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--sub);padding:4px 0;font-weight:700}
.cal .h:first-child{color:var(--red)}.cal .h:last-child{color:var(--blue)}
.cal .c{background:#fff;border-radius:10px;min-height:76px;padding:5px 4px;font-size:11px;border:1.5px solid transparent;text-align:left}
.cal .c .d{font-weight:700;font-size:13px;margin-bottom:2px}
.cal .c.sun .d{color:var(--red)}.cal .c.sat .d{color:var(--blue)}
.cal .c.today{border-color:var(--ink)}
.cal .c.empty{background:transparent}
.cal .c .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);line-height:1.4}
.cal .c .mk{font-size:10px;margin-top:2px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px}
.mhead .m{font-size:40px;font-weight:900}.mhead .m small{font-size:14px;color:var(--sub);font-weight:500;margin-right:6px}
.mhead button{border:none;background:#fff;border-radius:10px;padding:8px 14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs div{display:flex;max-width:480px;width:100%}
nav.tabs button{flex:1;border:none;background:none;padding:12px 0 18px;color:var(--sub);font-size:12px}
nav.tabs button b{display:block;font-size:20px;margin-bottom:2px}
nav.tabs button.on{color:var(--ink);font-weight:700}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.login{padding:40px 22px}
.login h1{font-size:28px;margin:0 0 4px}.login p{color:var(--sub);margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pin{letter-spacing:10px;text-align:center;font-size:22px!important}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:13px;margin-top:18px;width:100%}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px 30px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:18px}
.log{font-size:12px;color:var(--amber);margin-top:3px}
.demo{background:#fff7e6;color:#8a5a00;font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px;line-height:1.5}
.inline{display:flex;gap:8px}.inline>*{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.seg{display:flex;gap:6px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px}.seg button{flex:1;border:none;background:none;border-radius:10px;padding:11px 0;font-weight:700;color:var(--sub);font-size:15px}.seg button small{font-weight:500;font-size:12px}.seg button.on{background:var(--ink);color:#fff}.cmts{margin:10px 0 0 36px}.cmts .ho{margin-bottom:8px}.inline>*{min-width:0}.pgrid{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-bottom:12px}.pgrid label{font-size:13px;color:var(--sub)}.pgrid input{min-width:0;width:100%;box-sizing:border-box;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:#fff}.tag{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:4px}
</style>
</head>

function subscribeUsers(){

let booting=false, booted=false, screen='';
async function boot(){
  if(booting||me)return; booting=true;

    if(!S.users.some(u=>u.id==='admin')){ booting=false; booted=true; return renderSetup(); }

  const act=S.users.filter(u=>u.status==='active').sort((a,b)=>a.role==='admin'?-1:b.role==='admin'?1:0);

/* ===== 입장 후 실시간 구독 ===== */
function enter(id){
  screen='app';booted=true;
  myId=id;me=S.users.find(x=>x.id===id);ready=false;
  unsubs.push(onSnapshot(doc(db,'settings','main'),s=>{if(s.exists())Object.assign(S.settings,s.data());
    if(!ready){ready=true;viewDate=bizDate(new Date());tab='day';detail=false;cat=null;lastBiz=viewDate;}
    ensureMonth();render();},fail));
  if(isAdmin()) cleanupPhotos();
}
function ensureMonth(){
  const m=(tab==='month'&&viewMonth)?viewMonth:(viewDate||ymd(new Date())).slice(0,7);
  if(m===subMonth)return; subMonth=m;
  monthUnsubs.forEach(f=>f());monthUnsubs=[];
  const [y,mm]=m.split('-').map(Number);
  const start=ymd(new Date(y,mm-1,1)), end=ymd(new Date(y,mm,0));
  // 이번 달 + 앞뒤 하루 (영업일 경계)
  const s0=addDays(start,-1), e0=addDays(end,1);
  monthUnsubs.push(onSnapshot(query(collection(db,'days'),where(documentId(),'>=',s0),where(documentId(),'<=',e0)),snap=>{
    snap.docs.forEach(d=>{const x=d.data();S.schedule[d.id]=x.schedule||[];S.tasks[d.id]=x.tasks||{};});
    snap.docChanges().forEach(c=>{if(c.type==='removed'){delete S.schedule[c.doc.id];delete S.tasks[c.doc.id]}});
    render();},fail));
  monthUnsubs.push(onSnapshot(query(collection(db,'attendance'),where('date','>=',s0),where('date','<=',e0)),snap=>{
    S.attendance=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,...x,at:toIso(x.at),edits:x.edits||[]}}).sort((a,b)=>a.at<b.at?-1:1);
    render();},fail));
  monthUnsubs.push(onSnapshot(query(collection(db,'handovers'),where('date','>=',s0),where('date','<=',e0)),snap=>{
    S.handovers=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return {id:d.id,...x,at:toIso(x.at),edits:x.edits||[],re:x.re||{}}}).sort((a,b)=>a.at<b.at?-1:1);
    render();},fail));
}
async function cleanupPhotos(){
  try{const old=Timestamp.fromMillis(Date.now()-PHOTO_DAYS*864e5);
    const snap=await getDocs(query(collection(db,'photos'),where('at','<',old)));
    for(const d of snap.docs) await deleteDoc(d.ref);
  }catch(e){console.warn('photo cleanup',e)}
}

/* ===== GPS ===== */
function distM(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('nogeo'));
  navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
let punchMsg=null; // {cls,text} 화면이 새로 그려져도 유지
function showPunch(cls,text){punchMsg={cls,text,until:Date.now()+15000};const m=$('pm');if(m){m.className='msg show '+cls;m.textContent=text}}
async function punch(type){
  showPunch('','위치 확인 중…');
  const today=bizDate(new Date());let dist=null;
  try{const c=await getPos();dist=Math.round(distM(c.latitude,c.longitude,S.settings.lat,S.settings.lng));
    if(dist>S.settings.radius){showPunch('err',`매장에서 약 ${dist}m 떨어져 있어요. ${S.settings.radius}m 안에서만 ${type==='in'?'출근':'퇴근'}할 수 있어요.`);return}
  }catch(e){
    if(!S.settings.demo){showPunch('err',e.code===1?'위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치 권한을 허용해주세요.':'위치를 확인할 수 없어요. 잠시 후 다시 눌러주세요.');return}
  }
  try{await addDoc(collection(db,'attendance'),{uid:myId,date:today,type,at:serverTimestamp(),dist,edits:[]});
    showPunch('ok',`${hm(new Date().toISOString())} ${type==='in'?'출근':'퇴근'} 완료`+(dist==null?' (시연 모드)':` · 매장까지 ${dist}m`));
  }catch(e){showPunch('err','저장 실패: '+(e.code||e.message))}
}

function monthRange(off){const t=new Date();const d=new Date(t.getFullYear(),t.getMonth()+off,1);return [ymd(d),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]}
async function loadPay(){
  payLoading=true;render();
  try{const snap=await getDocs(query(collection(db,'attendance'),where('date','>=',payFrom),where('date','<=',payTo)));
    const evs=snap.docs.map(d=>{const x=d.data();return {id:d.id,...x,at:toIso(x.at),edits:x.edits||[]}}).sort((a,b)=>a.at<b.at?-1:1);
    payRows=computePay(evs);
  }catch(e){fail(e);payRows=[]}

function computePay(evs){
  const tol=S.settings.payTol||0, by={};
  evs.forEach(e=>{((by[e.uid]=by[e.uid]||{})[e.date]=by[e.uid][e.date]||[]).push(e)});
  return Object.entries(by).map(([uid,days])=>{
    const list=Object.keys(days).sort().map(date=>{
      const pairs=[],flags=[];let cur=null;
      days[date].forEach(e=>{ if(e.type==='in'){ if(cur){pairs.push({in:cur,out:null});flags.push('퇴근 누락')} cur=e; }
        else { if(cur){pairs.push({in:cur,out:e});cur=null} else {pairs.push({in:null,out:e});flags.push('출근 누락')} } });
      if(cur){pairs.push({in:cur,out:null});flags.push('퇴근 기록 없음')}
      let min=0;pairs.forEach(p=>{if(p.in&&p.out){p.min=Math.round((new Date(p.out.at)-new Date(p.in.at))/60000);min+=p.min}});
      const r=min%30, dev=Math.min(r,30-r);
      let paid=min-r; // 기본: 30분 단위 내림
      if(r!==0){ if(dev<=tol&&tol>0){ paid=r<15?min-r:min+(30-r) } else flags.push('30분 단위 아님') }
      const edited=days[date].some(e=>e.edits.length);
      return {date,pairs,min,paid,flags,edited};
    });
    const totalMin=list.reduce((a,d)=>a+d.min,0), paidMin=list.reduce((a,d)=>a+d.paid,0);
    return {uid,list,totalMin,paidMin,check:list.filter(d=>d.flags.length).length};
  }).sort((a,b)=>uname(a.uid).localeCompare(uname(b.uid),'ko'));
}

function editPair(uid,date,p){
  const dIn=p.in?ymd(new Date(p.in.at)):date, dOut=p.out?ymd(new Date(p.out.at)):date;
  openSheet(`<h2>${esc(uname(uid))} · ${date.slice(5).replace('-','/')} 시간 수정</h2>
    <div class="pgrid"><label>출근</label><input type="date" id="ein_d" value="${dIn}"><input type="time" id="ein_t" value="${p.in?hm(p.in.at):''}">
    <label>퇴근</label><input type="date" id="eout_d" value="${dOut}"><input type="time" id="eout_t" value="${p.out?hm(p.out.at):''}"></div>
    <div class="t" style="font-size:12px;color:var(--amber);margin-bottom:10px">자정 넘어 퇴근했으면 퇴근 날짜를 다음 날로. 고치면 원래 시간이 기록에 남아요.</div>
    <div class="inline"><button class="btn ghost" id="ec2">취소</button><button class="btn" id="es2">저장</button></div>`);
  $('ec2').onclick=closeSheet;
  $('es2').onclick=async()=>{
    const mk=(d,t)=>t?Timestamp.fromDate(new Date(d+'T'+t+':00')):null;
    const tin=mk($('ein_d').value,$('ein_t').value), tout=mk($('eout_d').value,$('eout_t').value);
    if(tin&&tout&&tout.toMillis()<=tin.toMillis()){toast('퇴근이 출근보다 빨라요. 날짜를 확인해주세요');return}
    const now=new Date().toISOString();
    try{
      const save=async(ev,ts,type)=>{if(!ts)return;
        if(ev){ if(ts.toMillis()!==new Date(ev.at).getTime()) await updateDoc(doc(db,'attendance',ev.id),{at:ts,edits:arrayUnion({by:myId,at:now,prev:ev.at})}); }
        else await addDoc(collection(db,'attendance'),{uid,date,type,at:ts,dist:null,edits:[{by:myId,at:now,prev:ts.toDate().toISOString(),manual:true}]});};
      await save(p.in,tin,'in'); await save(p.out,tout,'out');
      closeSheet();toast('수정했어요');loadPay();
    }catch(e){fail(e)}};
}
async function exportPay(){
  const wage=S.settings.wage||14000;
  const sum=[['이름','근무일수','실제 근무시간','인정 시간(30분 단위)','인정 시간(시간)','시급','지급액','확인 필요 일수']];
  const det=[['이름','날짜','요일','출근','퇴근','실제 근무(분)','인정 시간(시간)','확인 필요','수정됨']];
  payRows.forEach(r=>{sum.push([uname(r.uid),r.list.length,fmtHM(r.totalMin),fmtHM(r.paidMin),r.paidMin/60,wage,Math.round(r.paidMin/60*wage),r.check]);
    r.list.forEach(dd=>{const d0=parse(dd.date);dd.pairs.forEach((p,i)=>det.push([uname(r.uid),dd.date,DOW[d0.getDay()],p.in?hm(p.in.at):'',p.out?hm(p.out.at):'',p.min??'',i===0?dd.paid/60:'',i===0?dd.flags.join(', '):'',dd.edited?'예':'']))})});
  sum.push([]);sum.push(['합계','','','',payRows.reduce((a,r)=>a+r.paidMin,0)/60,'',payRows.reduce((a,r)=>a+Math.round(r.paidMin/60*wage),0),'']);
  const name=`백채_알바시간_${payFrom}_${payTo}`;
  try{
    if(!window.XLSX) await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.aoa_to_sheet(sum);ws1['!cols']=[{wch:10},{wch:8},{wch:14},{wch:16},{wch:12},{wch:8},{wch:12},{wch:12}];
    const ws2=XLSX.utils.aoa_to_sheet(det);ws2['!cols']=[{wch:10},{wch:11},{wch:5},{wch:7},{wch:7},{wch:12},{wch:14},{wch:20},{wch:7}];
    XLSX.utils.book_append_sheet(wb,ws1,'요약');XLSX.utils.book_append_sheet(wb,ws2,'날짜별 상세');
    XLSX.writeFile(wb,name+'.xlsx');toast('엑셀 파일을 받았어요');
  }catch(e){ // 엑셀 도구를 못 불러오면 CSV로
    const csv='﻿'+[...sum,[],...det].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();toast('CSV 파일로 받았어요 (엑셀로 열려요)');
  }
}

/* 사진 줄이기: 긴 변 1024px, JPEG 70% */
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  let k=Math.min(1,1024/Math.max(img.width,img.height)),q=0.7,out;const c=document.createElement('canvas');
  do{c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);k*=0.8;q-=0.1;}while(out.length>700000&&q>0.2);
  res(out);};img.src=fr.result;};fr.readAsDataURL(file);});}

/* ===== 렌더 ===== */
function render(){
  if(!me||!ready)return;
  const tabs=$('tabs');tabs.style.display='flex';
  $('tabAdmin').style.display=isAdmin()?'block':'none';
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='month'&&!viewMonth)viewMonth=viewDate.slice(0,7);
  const body=tab==='day'?renderDay():tab==='month'?renderMonth():renderAdmin();
  // 입력 중인 글 보존
  const keep=$('hotext')?$('hotext').value:'';
  if(document.activeElement&&document.activeElement.tagName==='TEXTAREA')return;
  if($('modal').classList.contains('show')&&document.activeElement&&$('sheet').contains(document.activeElement)) return; // 수정창 입력 중엔 화면 유지
  $('app').innerHTML=`<header><div class="brand">백채 근무일지<small>성지길점</small></div><button class="me" id="logout">${esc(me.name)}${isAdmin()?' 👑':''} · 나가기</button></header><div class="wrap">${body}</div>`;
  if($('hotext'))$('hotext').value=keep;
  $('logout').onclick=logout;
  if(tab==='day')bindDay();else if(tab==='month')bindMonth();else bindAdmin();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==='day'){detail=false;cat=null;viewDate=bizDate(new Date())}
  if(b.dataset.tab!=='admin')payView=false;tab=b.dataset.tab;if(tab==='month')viewMonth=viewDate.slice(0,7);window.scrollTo(0,0);ensureMonth();render()});
let lastBiz=null;
setInterval(()=>{if(!ready)return;const b=bizDate(new Date());if(b!==lastBiz){if(viewDate===lastBiz){viewDate=b;detail=false;cat=null;ensureMonth()}lastBiz=b;render()}},60000);
