 th:['วิธีทานซุปกิมจิ\nก่อนอื่น ตัดเนื้อที่อยู่ก้นหม้อก่อน แล้วต้มต่ออีก 3–4 นาที ก็ทานได้เลยค่ะ\nถ้าต้องการข้าวหรือน้ำซุปเพิ่ม บอกพนักงานได้เลยนะคะ ขอให้อร่อยนะคะ','위티- 탄 쑵 낌찌. 껀 은, 땃 느-아 티- 유- 꼰 머- 껀, 래-우 똠 떠- 익 쌈 씨- 나-티-, 꺼 탄 다이 러-이 카. 타- 떵깐 카-우 르- 남쑵 프-암, 버-억 파낙응안 다이 러-이 나카. 커- 하이 아로-이 나카.']},
{t:'김치 + 고기구이 먹는 법',ko:'불판이 달궈지면 고기를 구워 주세요. 김치, 두부, 꽈리고추도 아래쪽에 같이 구워 주세요.\n* 불판은 가운데 화력이 가장 세니, 가운데서 익히다가 익은 고기는 위쪽으로 옮겨 주세요.\n* 첫 점은 소금만 찍어 드시는 것을 추천해요. 두 번째부터는 구운 김치, 쌈장, 쌈, 파채 등 취향에 맞게 드세요. 맛있게 드세요.',
 en:['How to enjoy Korean BBQ with grilled kimchi\nOnce the grill is hot, start grilling the meat.\nGrill the kimchi, tofu, and shishito peppers together on the lower part of the grill.\n* The center of the grill is the hottest. Cook the meat in the center, then move cooked pieces to the top.\n* We recommend the first bite with just salt. After that, enjoy it your way with grilled kimchi, ssamjang (dipping sauce), ssam (leafy vegetable wraps), or pa-chae (shredded green onion).\nEnjoy your meal!','하우 투 인조이 코리안 비비큐. 원스 더 그릴 이즈 핫, 스타트 그릴링 더 미트. 그릴 더 김치, 토푸, 앤 시시토 페퍼스 투게더 온 더 로워 파트 오브 더 그릴. 더 센터 오브 더 그릴 이즈 더 핫티스트. 쿡 더 미트 인 더 센터, 덴 무브 쿡트 피시스 투 더 탑. 위 레커멘드 더 퍼스트 바이트 위드 저스트 솔트. 애프터 댓, 인조이 잇 유어 웨이 위드 그릴드 김치, 쌈장, 쌈 (리피 베지터블 랩스), 오어 파채 (슈레디드 그린 어니언). 인조이 유어 밀!'],
 zh:['韩式泡菜烤肉的吃法\n烤盘烧热后，就可以开始烤肉了。\n泡菜、豆腐和糯米椒也请放在烤盘下方一起烤。\n* 烤盘中间火力最大，请在中间烤熟，烤好的肉移到上方即可。\n* 第一块建议只蘸盐吃，之后可以按个人口味搭配烤泡菜、包饭酱、蔬菜叶包肉、葱丝等一起享用。\n祝您用餐愉快！','한스 카오러우 더 츠파. 카오판 사오러 허우, 지우 커이 카이스 카오러우 러. 파오차이, 떠우푸 허 눠미쟈오 예 칭 팡짜이 카오판 샤팡 이치 카오. 카오판 중지엔 훠리 쭈이따, 칭 짜이 중지엔 카오수, 카오하오 더 러우 이따오 상팡 지커. 디이콰이 지엔이 즈 잔 옌 츠, 즈허우 커이 안 거런 커우웨이 따페이 카오 파오차이, 바오판쟝, 수차이예 바오러우, 충쓰 덩 이치 샹용. 주 닌 용찬 위콰이!'],
 ja:['キムチと焼く韓国式焼肉の食べ方\n鉄板が温まったら、お肉を焼いてください。\nキムチ、豆腐、ししとうも下の方で一緒に焼いてください。\n※鉄板は真ん中が一番火力が強いので、真ん中で焼いて、焼けたお肉は上の方へ移してください。\n※最初の一切れは塩だけでお召し上がりいただくのがおすすめです。二切れ目からは焼きキムチ、サムジャン、包み野菜（サンチュなど）、千切りネギ（パチェ）など、お好みでどうぞ。\nどうぞごゆっくりお召し上がりください。','야키니쿠노 타베카타. 텟판가 아타타맛타라, 오니쿠오 야이테 쿠다사이. 기무치, 토-후, 시시토-모 시타노 호-데 잇쇼니 야이테 쿠다사이. 텟판와 만나카가 이치반 카료쿠가 쓰요이노데, 만나카데 야이테, 야케타 오니쿠와 우에노 호-에 우쓰시테 쿠다사이. 사이쇼노 히토키레와 시오다케데 오메시아가리 이타다쿠노가 오스스메데스. 후타키레메카라와 야키기무치, 사무장, 쓰쓰미야사이 (산추 나도), 센기리네기 (파체) 나도, 오코노미데 도-조. 도-조 고윳쿠리 오메시아가리 쿠다사이.'],
 th:['วิธีทานบาร์บีคิวเกาหลีย่างกับกิมจิ\nเมื่อกระทะร้อนแล้ว เริ่มย่างเนื้อได้เลยค่ะ\nกิมจิ เต้าหู้ และพริกชิชิโตะ ย่างพร้อมกันที่ด้านล่างของกระทะได้เลยค่ะ\n* ตรงกลางกระทะไฟแรงที่สุด ย่างตรงกลางจนสุก แล้วย้ายเนื้อที่สุกแล้วไปไว้ด้านบนค่ะ\n* ชิ้นแรกแนะนำให้จิ้มเกลืออย่างเดียว ชิ้นต่อไปทานคู่กับกิมจิย่าง ซัมจัง ผักห่อ หรือต้นหอมซอย ได้ตามชอบเลยค่ะ\nขอให้อร่อยนะคะ','위티- 탄 바-비-키우 까올리-. 므-아 끄라타 런 래-우, 르-ㅁ 양 느-아 다이 러-이 카. 낌찌, 따오후-, 래 프릭 치치또, 양 프롬깐 티- 단랑 컹 끄라타 다이 러-이 카. 뜨롱끌랑 끄라타 파이 랭 티-쑷, 양 뜨롱끌랑 쫀 쑥, 래-우 야-이 느-아 티- 쑥 래-우 빠이 와이 단본 카. 친 래-ㄱ 내남 하이 찜 끌르-아 양 디-아우, 친 떠- 빠이 탄 쿠- 깝 낌찌 양, 쌈짱, 팍 허-, 르- 똔험 써-이 다이 따-ㅁ 촙 러-이 카. 커- 하이 아로-이 나카.']},
];

var lang='en',Q={};
var LMAP={en:'en',zh:'zh',ja:'ja',th:'th'};
try{var bl=(navigator.language||'').slice(0,2);if(LMAP[bl])lang=bl}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function won(n){var v=n.toLocaleString('en-US');return lang==='en'?'₩'+v:lang==='th'?v+' '+D[lang].ui.sub:v+D[lang].ui.sub}
var PR={},KO={};G.forEach(function(g){g[2].forEach(function(it){PR[it[0]]=it[2];KO[it[0]]=it[1]})});
var MEAT=['belly','jowl','collar'];
function meatN(){return MEAT.reduce(function(a,k){return a+(Q[k]||0)},0)}
function render(){var d=D[lang],u=d.ui;document.documentElement.lang=lang;
 var h='<div class="top">BAEKCHAE <small translate="no">백채 김치찌개</small></div><div class="tb">'+TR_LANGS.map(function(l){return '<button class="'+(lang===l[0]?'on':'')+'" data-l="'+l[0]+'">'+TR_SUB[l[0]]+'</button>'}).join('')+'</div>';
 h+='<div class="btns"><button id="bm">'+u.menu+'</button><button id="bh">'+u.how+'</button></div>';
 G.forEach(function(g){h+='<div class="cd"><h3>'+esc(d.title[g[1]])+'</h3>';
  if(g[0]==='bbq'){var mn=meatN();h+='<div class="min'+(mn===1?' bad':'')+'">'+esc(u.min)+'</div>'}
  if(g[0]==='meal')h+='<div class="nt">'+esc(d.note)+'</div>';
  g[2].forEach(function(it){var id=it[0],n=Q[id]||0;
   h+='<div class="r">'+(id==='stew'?'<img src="menu/jjigae.png" alt="">':'')+'<span class="n">'+esc(d.nm[id])+(id==='stew'?' · '+esc(d.one):'')+(d.cut[id]?'<i class="cut">'+esc(d.cut[id])+'</i>':'')+'<small translate="no">'+esc(it[1])+'</small></span><span class="p">'+won(it[2])+'</span><span class="q"><button data-m="'+id+'">−</button><b>'+n+'</b><button class="'+(n?'on':'')+'" data-p="'+id+'">+</button></span></div>'});
  h+='</div>'});
 h+='<div style="text-align:center;margin:10px 0"><button id="br" style="border:none;background:none;color:#7a7268;text-decoration:underline;font-family:inherit;font-size:13px">'+u.reset+'</button></div>';
 document.getElementById('app').innerHTML=h;
 var cnt=0,sum=0;Object.keys(Q).forEach(function(k){cnt+=Q[k];sum+=Q[k]*PR[k]});
 var bad=meatN()===1;
 document.getElementById('bar').innerHTML='<div class="in"><div><div class="t">'+(bad?esc(u.minw):cnt?cnt+' '+u.sel:esc(u.none))+'</div><div class="s">'+u.tot+' '+won(sum)+'</div></div><button id="bs"'+(cnt&&!bad?'':' disabled')+'>'+u.conf+'</button></div>';
 bind()}
function ov(html,dark){var o=document.createElement('div');o.className='ov'+(dark?' dark':'');o.innerHTML='<div class="in">'+html+'<button class="cl">'+D[lang].ui.close+'</button></div>';document.body.appendChild(o);o.querySelector('.cl').onclick=function(){o.remove()};return o}
function bind(){
 document.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){lang=b.dataset.l;render()}});
 document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){Q[b.dataset.p]=(Q[b.dataset.p]||0)+1;render()}});
 document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var k=b.dataset.m;if(Q[k]){Q[k]--;if(!Q[k])delete Q[k]}render()}});
 document.getElementById('br').onclick=function(){Q={};render()};
 document.getElementById('bm').onclick=function(){var o=document.createElement('div');o.className='mrot';o.innerHTML='<img src="menu/menu_'+lang+'.jpg" alt=""><button>'+D[lang].ui.close+'</button>';document.body.appendChild(o);o.querySelector('button').onclick=function(){o.remove()}};
 document.getElementById('bh').onclick=function(){var t=function(n){return '<div class="hw"><div>'+esc(TRANS[n][lang][0])+'</div></div>'};ov('<div class="hwimg"><img src="howto/how_stew_'+lang+'.jpg" alt="">'+t(1)+'<img src="howto/how_bbq_'+lang+'.jpg" alt="" style="margin-top:16px">'+t(2)+t(0)+'</div>')};
 var bs=document.getElementById('bs');if(bs)bs.onclick=cart;
}
function cart(){var u=D[lang].ui,d=D[lang],sum=0,cnt=0;
 var rows=Object.keys(PR).filter(function(k){return Q[k]}).map(function(k){sum+=Q[k]*PR[k];cnt+=Q[k];return '<div class="cr"><span>'+esc(d.nm[k])+(d.cut[k]?' <i class="cut">'+esc(d.cut[k])+'</i>':'')+'<small translate="no">'+esc(KO[k])+'</small></span><span class="v"><b>× '+Q[k]+'</b>'+won(Q[k]*PR[k])+'</span></div>'}).join('');
 var o=document.createElement('div');o.className='sh';
 o.innerHTML='<div class="shd"></div><div class="shb"><div class="sht">'+esc(u.cart)+' ('+cnt+')</div>'+rows+'<div class="ctot"><span>'+u.tot+'</span><span>'+won(sum)+'</span></div><div class="cbt"><button class="ce">'+esc(u.edit)+'</button><button class="cs">'+esc(u.show)+'</button></div></div>';
 document.body.appendChild(o);o.querySelector('.shd').onclick=o.querySelector('.ce').onclick=function(){o.remove()};
 o.querySelector('.cs').onclick=function(){o.remove();staff()};}
function staff(){var u=D[lang].ui,sum=0;
  var rows=Object.keys(PR).filter(function(k){return Q[k]}).map(function(k){sum+=Q[k]*PR[k];return '<div class="ol"><div><div class="k" translate="no">'+esc(KO[k])+'</div><div class="f">'+esc(D[lang].nm[k])+'</div></div><div class="x">× '+Q[k]+'</div></div>'}).join('');
  ov('<div style="background:#1f1b16;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:6px"><div translate="no" style="font-size:20px;font-weight:900">직원 확인용 · 주문 내역</div><div style="font-size:13px;opacity:.8;margin-top:2px">'+esc(u.staff)+'</div></div>'+rows+'<div class="otot"><span>합계'+(lang?' · '+u.tot:'')+'</span><span>'+sum.toLocaleString('ko-KR')+'원</span></div>')}
render();
</script></body></html>
